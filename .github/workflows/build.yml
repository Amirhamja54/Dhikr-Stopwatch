name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create project and apply files
        run: |
          unzip -q dhikr_stopwatch_files.zip
          flutter create --platforms=android --org com.example dhikr_stopwatch
          cp -r dhikr_stopwatch_files/android/. dhikr_stopwatch/android/
          cp -r dhikr_stopwatch_files/lib/. dhikr_stopwatch/lib/
          rm -f dhikr_stopwatch/test/widget_test.dart
      - name: Build
        working-directory: dhikr_stopwatch
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: dhikr-stopwatch-apk
          path: dhikr_stopwatch/build/app/outputs/flutter-apk/app-release.apk
