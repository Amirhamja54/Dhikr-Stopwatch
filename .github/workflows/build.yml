name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create project and apply files
        run: |
          unzip -q dhikr_stopwatch_files.zip
          flutter create --platforms=android --org com.example dhikr_stopwatch
          cp -r dhikr_stopwatch_files/android/. dhikr_stopwatch/android/
          cp -r dhikr_stopwatch_files/lib/. dhikr_stopwatch/lib/
          rm -f dhikr_stopwatch/test/widget_test.dart

      - name: Create a permanent signing key (first run only)
        id: keygen
        run: |
          KS="$GITHUB_WORKSPACE/keystore/upload-keystore.jks"
          mkdir -p "$(dirname "$KS")"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -v -keystore "$KS" -alias dhikr \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass dhikrStopwatch123 -keypass dhikrStopwatch123 \
              -dname "CN=Dhikr Stopwatch, OU=Personal, O=Personal, L=Dhaka, S=Dhaka, C=BD"
            echo "created=1" >> "$GITHUB_OUTPUT"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Wire the signing key into the build
        working-directory: dhikr_stopwatch
        run: |
          if [ -f android/app/build.gradle ]; then
            cat >> android/app/build.gradle <<'GRADLE'

android {
    signingConfigs {
        release {
            storeFile file(System.getenv("DHIKR_KEYSTORE"))
            storePassword System.getenv("DHIKR_STORE_PASSWORD")
            keyAlias System.getenv("DHIKR_KEY_ALIAS")
            keyPassword System.getenv("DHIKR_KEY_PASSWORD")
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
GRADLE
          fi
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts <<'GRADLE'

android {
    signingConfigs {
        create("release") {
            storeFile = file(System.getenv("DHIKR_KEYSTORE")!!)
            storePassword = System.getenv("DHIKR_STORE_PASSWORD")
            keyAlias = System.getenv("DHIKR_KEY_ALIAS")
            keyPassword = System.getenv("DHIKR_KEY_PASSWORD")
        }
    }
    buildTypes {
        getByName("release") {
            signingConfig = signingConfigs.getByName("release")
        }
    }
}
GRADLE
          fi

      - name: Build
        working-directory: dhikr_stopwatch
        env:
          DHIKR_KEYSTORE: ${{ env.KEYSTORE_PATH }}
          DHIKR_STORE_PASSWORD: dhikrStopwatch123
          DHIKR_KEY_ALIAS: dhikr
          DHIKR_KEY_PASSWORD: dhikrStopwatch123
        run: flutter build apk --release

      - name: Save the signing key back to the repo (first run only)
        if: steps.keygen.outputs.created == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keystore/upload-keystore.jks
          git commit -m "Add permanent signing key (auto-generated)"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: dhikr-stopwatch-apk
          path: dhikr_stopwatch/build/app/outputs/flutter-apk/app-release.apk
